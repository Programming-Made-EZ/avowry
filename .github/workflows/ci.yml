name: ci

# Trunk-based: every push to main and every short-lived PR runs the full suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Phrase.sln

      - name: Build
        run: dotnet build Phrase.sln --no-restore -c Release

      # Pending acceptance tests are the outer TDD loop. They are compiled (so they
      # cannot rot) but excluded from the gate until they go green.
      - name: Test
        run: dotnet test Phrase.sln --no-build -c Release --filter "Status!=Pending" --logger "console;verbosity=normal"

  # Detects the Usable v1 milestone (board/MILESTONE-usable-v1.md). Non-blocking until card 012 makes it a gate.
  usable-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Usable v1 acceptance test
        id: usable
        run: dotnet test Phrase.sln -c Release --filter "Milestone=UsableV1" --logger "console;verbosity=normal"

      - name: Report
        if: steps.usable.outcome == 'success'
        run: |
          echo "USABLE v1 REACHED"
          echo "USABLE v1 REACHED: demo app at demo/tasks (see its README)" >> "$GITHUB_STEP_SUMMARY"
