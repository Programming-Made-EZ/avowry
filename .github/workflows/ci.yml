name: ci

# Trunk-based: every push to main and every short-lived PR runs the full suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mob-process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check mob process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/mob_process.py check

      - name: Check with previous checker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "::notice::push has no prior commit; previous-version check skipped"
          elif ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            echo "::notice::push boundary is not an ancestor of HEAD; previous-version check skipped"
          elif git show "$BEFORE:scripts/mob_process.py" > "$RUNNER_TEMP/mob_process_prev.py" 2>/dev/null; then
            python3 "$RUNNER_TEMP/mob_process_prev.py" check --root . --skip-regeneration
          else
            echo "::notice::push boundary has no mob-process checker; previous-version check skipped"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Phrase.sln

      - name: Build
        run: dotnet build Phrase.sln --no-restore -c Release

      # Pending acceptance tests are the outer TDD loop. They are compiled (so they
      # cannot rot) but excluded from the gate until they go green.
      - name: Test
        run: dotnet test Phrase.sln --no-build -c Release --filter "Status!=Pending" --logger "console;verbosity=normal"

  # Gates the reached Usable v1 milestone. Every bar is ratcheted, so any regression makes this job red.
  usable-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Phrase.sln -c Release

      - name: Usable v1 report
        run: python3 scripts/usable-v1-report.py
