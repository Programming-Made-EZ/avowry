name: mob-process

on:
  issues:
    types: [closed, reopened, unlabeled]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  mob-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check mob process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/mob_process.py check
      - name: Check with previous checker
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          if git show HEAD~1:scripts/mob_process.py > "$RUNNER_TEMP/mob_process_prev.py" 2>/dev/null; then
            python3 "$RUNNER_TEMP/mob_process_prev.py" check --root .
          else
            echo "::notice::HEAD~1 has no mob-process checker; previous-version check skipped"
          fi
